<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            // Capture runtime errors early for debugging
            window.__errors = [];
            window.addEventListener('error', function (e) {
                try {
                    window.__errors.push({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error && e.error.stack });
                } catch (err) { /* ignore */ }
            });
            window.addEventListener('unhandledrejection', function (e) {
                try {
                    window.__errors.push({ message: e.reason && e.reason.message ? e.reason.message : String(e.reason) });
                } catch (err) { /* ignore */ }
            });
        </script>

    <body>
        <div id="container"><br /><br /><br
/><br /><br />Loading...</div>
		<div id="speedometer">0.0 km/h</div>
        <div
id="info">Ammo.js Raycast vehicle demo<br>Press W,A,S,D to
move.</div>


        <script src="builds/ammo.wasm.js"></script>

        <script type="module" src="js/three/OrbitControls.js"></script>

        <script src="js/three/Detector.js"></script>
        <script src="js/three/stats.min.js"></script>

        <script type="module">
            import * as THREE from './js/three/three.module.min.js';
            import { OrbitControls } from './js/three/OrbitControls.js';

            Ammo().then(function(Ammo) {

                // Detects webgl
                if (!Detector.webgl) {
                    Detector.addGetWebGLMessage();
                }

                // Minimal demo implementations (show a simple scene so the page is not stuck at "Loading...")
                let scene, camera, renderer, controls, cube, carModel = null;
                let clock = null;
                const moveState = { forward: false, left: false, right: false };
                const CAR_SPEED = 17; // units per second
                const MAX_STEER = Math.PI / 6; // 30deg max steering angle
                const STEER_SPEED = Math.PI; // rad/s steering wheel rate
                const WHEELBASE = 3; // distance between axles — affects turn radius
                let steeringAngle = 0; // current steering angle (radians)
                let sideView = 0; // 0 = follow, 1 = left, -1 = right (while PageUp/PageDown held)
                const CAMERA_LOOK_Y_OFFSET = 1.2; // vertical offset to look slightly above the car's center
                // Wheel replacement settings
                const WHEEL_MODEL_PATH = '/assets/models/G87/bmw_wheel_19inch_model_859.glb';
                let wheelObjs = []; // { steer, spin, mesh, radius, isFront }
                const WHEEL_SPIN_AXIS = 'x'; // local axis used for wheel spin (may need tweaking per model)
                const WHEEL_STEER_AXIS = 'y'; // local axis used for steering pivot

                function onWindowResize() {
                    if (!camera || !renderer) return;
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }

                function onKeyDown(e) {
                    const k = e.key.toLowerCase();
                    if (k === 'w') moveState.forward = true;
                    if (k === 'a') moveState.left = true;
                    if (k === 'd') moveState.right = true;
                    if (e.code === 'PageUp') sideView = 1;
                    if (e.code === 'PageDown') sideView = -1;
                }

                function onKeyUp(e) {
                    const k = e.key.toLowerCase();
                    if (k === 'w') moveState.forward = false;
                    if (k === 'a') moveState.left = false;
                    if (k === 'd') moveState.right = false;
                    if (e.code === 'PageUp' || e.code === 'PageDown') sideView = 0;
                }

                function initGraphics() {
                    const container = document.getElementById('container');
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0xbfd1e5);

                    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 6, 15);

                    renderer = new THREE.WebGLRenderer({ antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio || 1);
                    // Disable shadows entirely for a clean 'no shadows' sun look
                    renderer.shadowMap.enabled = false;
                    container.innerHTML = '';
                    container.appendChild(renderer.domElement);

                    // Sun-like directional light (no shadows)
                    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
                    sun.position.set(50, 100, 50);
                    sun.castShadow = false;
                    scene.add(sun);
                    // Keep a small ambient for softer lighting
                    scene.add(new THREE.AmbientLight(0x404040));

                    const geometry = new THREE.BoxGeometry(2, 2, 2);
                    const material = new THREE.MeshStandardMaterial({ color: 0x44aa88 });
                    cube = new THREE.Mesh(geometry, material);
                    cube.position.y = 1;
                    scene.add(cube);

                    const groundGeo = new THREE.PlaneGeometry(60, 60);
                    const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                    const ground = new THREE.Mesh(groundGeo, groundMat);
                    ground.rotation.x = -Math.PI / 2;
                    scene.add(ground);

                    controls = new OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;

                    window.addEventListener('resize', onWindowResize, false);
                    // clock and input
                    clock = new THREE.Clock();
                    window.addEventListener('keydown', onKeyDown);
                    window.addEventListener('keyup', onKeyUp);

                    // Load the car model and replace the placeholder cube when ready
                    // Dynamically fetch the upstream GLTFLoader source, rewrite its imports
                    // to use local three and utils, then import it via a blob URL.
                    // Prefer a local copy of GLTFLoader if available, otherwise fetch upstream and rewrite imports.
                    // Always fetch the full upstream GLTFLoader and rewrite its imports
                    // to point at our local three and utils files, then import as a blob.
                    (async () => {
                        const r = await fetch('https://unpkg.com/three@0.154.0/examples/jsm/loaders/GLTFLoader.js');
                        const src = await r.text();
                        const origin = location.origin;
                        let fixed = src.replace(/from\s+['"]three['"]/g, "from '" + origin + "/js/three/three.module.min.js'");
                        fixed = fixed.replace(/from\s+['"]\.\.\/utils\/BufferGeometryUtils.js['"]/g, "from '" + origin + "/js/three/utils/BufferGeometryUtils.js'");
                        const blob = new Blob([fixed], { type: 'text/javascript' });
                        const url = URL.createObjectURL(blob);
                        return import(url);
                    })().then(({ GLTFLoader }) => {
                        const loader = new GLTFLoader();
                        // load the wheelless car (you added `model-without-wheels.glb`)
                        loader.load('/assets/models/G87/model-without-wheels.glb', (gltf) => {
                            const car = gltf.scene;

                            // Center and scale the car to a larger size
                            const box = new THREE.Box3().setFromObject(car);
                            const size = new THREE.Vector3();
                            box.getSize(size);
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const targetSize = 8; // increase target size (units)
                            if (maxDim > 0) {
                                const scale = targetSize / maxDim;
                                car.scale.setScalar(scale);
                            }
                            // Recompute bounds after scaling and center the model
                            box.setFromObject(car);
                            box.getCenter(size).negate();
                            car.position.add(size);

                            // Place on ground
                            car.position.y = 0;

                            scene.add(car);
                            carModel = car;
                                try { window.__carChildCount = car.children ? car.children.length : 0; } catch (e) {}
                            if (cube) cube.visible = false;

                            // Position camera behind the car and update controls
                            const carWorldPos = new THREE.Vector3();
                            car.getWorldPosition(carWorldPos);
                            // Start a bit closer and slightly higher
                            camera.position.set(carWorldPos.x, carWorldPos.y + 4.5, carWorldPos.z + 7);
                            const initialLook = carWorldPos.clone(); initialLook.y += CAMERA_LOOK_Y_OFFSET;
                            controls.target.copy(initialLook);
                            controls.update();

                            // Attempt to load replacement wheel model and mount as independent steer+spin pivots.
                            // Place a file at `public/assets/models/wheel.glb` (download the Sketchfab asset
                            // and rename to `wheel.glb`) to enable replacement. If not present, this step is skipped.
                            try {
                                // helper: create simple torus wheels if no external wheel model is available
                                function createProceduralWheels(carObj, boxRef) {
                                    carObj.updateMatrixWorld(true);
                                    scene.updateMatrixWorld(true);
                                    const boxWorld = boxRef || new THREE.Box3().setFromObject(carObj);
                                    const center = boxWorld.getCenter(new THREE.Vector3());
                                    const size = boxWorld.getSize(new THREE.Vector3());
                                    // use slightly larger inset so wheels sit under the arches reliably
                                    const halfX = (size.x / 2) * 0.75;
                                    const halfZ = (size.z / 2) * 0.85;
                                    const lateralClearance = Math.max(size.x * 0.06, 0.04);
                                    const longitudinalClearance = Math.max(size.z * 0.04, 0.03);
                                    const radius = Math.max(size.x, size.z) * 0.07 || 0.28;
                                    const thickness = Math.max(radius * 0.55, 0.08);
                                    const y = boxWorld.min.y + radius + Math.max(size.y * 0.02, 0.02);

                                    const leftX = center.x - (halfX - radius - lateralClearance);
                                    const rightX = center.x + (halfX - radius - lateralClearance);
                                    const frontZ = center.z + (halfZ - radius - longitudinalClearance);
                                    const rearZ = center.z - (halfZ - radius - longitudinalClearance);

                                    const positions = [
                                        { x: leftX, z: frontZ, isFront: true },
                                        { x: rightX, z: frontZ, isFront: true },
                                        { x: leftX, z: rearZ, isFront: false },
                                        { x: rightX, z: rearZ, isFront: false }
                                    ];

                                    const wheelGeo = new THREE.CylinderGeometry(radius, radius, thickness, 36);
                                    // align cylinder axis to X (spin around X)
                                    wheelGeo.rotateZ(Math.PI / 2);
                                    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.4, roughness: 0.6 });

                                    const carCenterWorld = new THREE.Vector3();
                                    carObj.getWorldPosition(carCenterWorld);

                                    for (const p of positions) {
                                        const steer = new THREE.Object3D();
                                        const spin = new THREE.Object3D();
                                        carObj.add(steer);
                                        steer.add(spin);

                                        const wheelMesh = new THREE.Mesh(wheelGeo.clone(), wheelMat.clone());
                                        // ensure wheel geometry centered
                                        wheelMesh.geometry.computeBoundingBox && wheelMesh.geometry.computeBoundingBox();
                                        spin.add(wheelMesh);

                                        // attempt to find the inner wheel-well surface via raycast and position wheel center there
                                        let desiredCenterY = y;
                                        try {
                                            const ray = new THREE.Raycaster();
                                            const topY = boxWorld.max.y + 1.0;
                                            ray.set(new THREE.Vector3(p.x, topY, p.z), new THREE.Vector3(0, -1, 0));
                                            const hits = ray.intersectObject(carObj, true);
                                            if (hits && hits.length) {
                                                const hit = hits[0];
                                                const clearanceTop = Math.max(size.y * 0.02, 0.02);
                                                desiredCenterY = hit.point.y - clearanceTop - radius;
                                                const minAllowed = boxWorld.min.y + radius + Math.max(size.y * 0.01, 0.01);
                                                const maxAllowed = boxWorld.max.y - radius - 0.01;
                                                desiredCenterY = Math.min(Math.max(desiredCenterY, minAllowed), maxAllowed);
                                            }
                                        } catch (err) {}

                                        const worldPos = new THREE.Vector3(p.x, desiredCenterY, p.z);
                                        const localPos = carObj.worldToLocal(worldPos.clone());
                                        steer.position.copy(localPos);

                                        // Make wheel face outward: if its forward (-Z) points toward car center, flip it
                                        try {
                                            wheelMesh.updateMatrixWorld(true);
                                            const e = wheelMesh.matrixWorld.elements;
                                            const fwd = new THREE.Vector3(-e[8], -e[9], -e[10]).normalize();
                                            const meshPos = new THREE.Vector3(e[12], e[13], e[14]);
                                            const toCenter = carCenterWorld.clone().sub(meshPos).normalize();
                                            if (fwd.dot(toCenter) > 0.0) {
                                                wheelMesh.rotateY(Math.PI);
                                            }
                                        } catch (err) {}

                                        wheelObjs.push({ steer, spin, mesh: wheelMesh, radius, isFront: p.isFront });
                                    }

                                    console.log('Procedural wheels created:', wheelObjs.length);
                                    try { window.__wheelObjs = wheelObjs; } catch (e) {}
                                }

                                // Try fetching the wheel GLB and parse it directly (more robust than loader.load in some servers)
                                (async () => {
                                    try {
                                        const res = await fetch(WHEEL_MODEL_PATH);
                                        if (!res.ok) {
                                            console.warn('Wheel GLB fetch failed:', res.status, res.statusText, '; creating procedural wheels instead.');
                                            createProceduralWheels(car, box);
                                            return;
                                        }
                                        const ab = await res.arrayBuffer();
                                        loader.parse(ab, WHEEL_MODEL_PATH, (wheelGltf) => {
                                                // use the full wheel scene as a template (preserve all parts of the provided GLB)
                                                const wheelTemplate = wheelGltf.scene.clone();
                                                let foundAnyMesh = false;
                                                wheelTemplate.traverse(n => { if (n.isMesh) foundAnyMesh = true; });
                                                if (!foundAnyMesh) { console.warn('Wheel GLB contains no mesh; creating procedural wheels instead.'); createProceduralWheels(car, box); return; }

                                            // ensure world matrices are up-to-date before sampling
                                            car.updateMatrixWorld(true);
                                            scene.updateMatrixWorld(true);
                                            // collect wheel anchor nodes from the car by name (meshes or empty nodes)
                                            const foundNodes = [];
                                            car.traverse(node => {
                                                const nm = (node.name || '').toLowerCase();
                                                if (nm.includes('wheel') || nm.includes('tyre') || nm.includes('tire') || nm.includes('rim') || nm.includes('hub') || nm.includes('axle')) {
                                                    foundNodes.push(node);
                                                }
                                            });

                                            // compute wheel attachment slots. Prefer bounding-box corners for reliability.
                                            const FORCE_BOX_SLOTS = true; // set true to always use bbox-based wheel slots
                                            const slots = [];
                                            if (!FORCE_BOX_SLOTS && foundNodes.length > 0) {
                                                // build candidates with world + local positions
                                                const candidates = [];
                                                foundNodes.forEach(n => {
                                                    const p = new THREE.Vector3();
                                                    n.getWorldPosition(p);
                                                    if (n.isMesh) n.visible = false; // hide original mesh if present
                                                    const local = car.worldToLocal(p.clone());
                                                    candidates.push({ node: n, worldPos: p.clone(), localPos: local });
                                                });

                                                // dedupe by world position (tolerance = 2% of car size)
                                                const sizeVec = box.getSize(new THREE.Vector3());
                                                const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z) || 1;
                                                const dedupTol = Math.max(maxDim * 0.02, 0.02);
                                                let unique = [];
                                                candidates.forEach(c => {
                                                    let dup = false;
                                                    for (let u of unique) {
                                                        if (u.worldPos.distanceTo(c.worldPos) < dedupTol) { dup = true; break; }
                                                    }
                                                    if (!dup) unique.push(c);
                                                });

                                                // filter out anchors that are too close to the car center (spare/center mounts)
                                                const carCenterWorldFilter = new THREE.Vector3();
                                                box.getCenter(carCenterWorldFilter);
                                                const carCenterLocalFilter = car.worldToLocal(carCenterWorldFilter.clone());
                                                const lengthThreshold = Math.max(sizeVec.z * 0.18, 0.4);
                                                unique = unique.filter(u => {
                                                    u.localPos = car.worldToLocal(u.worldPos.clone());
                                                    return Math.abs(u.localPos.z - carCenterLocalFilter.z) > lengthThreshold;
                                                });

                                                if (unique.length >= 4) {
                                                    // decide front/rear and left/right using car-local Z/X
                                                    unique.sort((a, b) => a.localPos.z - b.localPos.z);
                                                    const front = unique.slice(0, 2).sort((a, b) => a.localPos.x - b.localPos.x);
                                                    const rear = unique.slice(-2).sort((a, b) => a.localPos.x - b.localPos.x);
                                                    slots.push(front[0].worldPos.clone(), front[1].worldPos.clone(), rear[0].worldPos.clone(), rear[1].worldPos.clone());
                                                } else {
                                                    // take unique positions and fill with bounding-box corners
                                                    unique.forEach(u => slots.push(u.worldPos.clone()));
                                                    const box2 = new THREE.Box3().setFromObject(car);
                                                    const center = box2.getCenter(new THREE.Vector3());
                                                    const min = box2.min, max = box2.max;
                                                    const halfX = (max.x - min.x) / 2 * 0.9;
                                                    const halfZ = (max.z - min.z) / 2 * 0.9;
                                                    const box2Size = box2.getSize(new THREE.Vector3());
                                                    const slotApproxRadius2 = Math.max(box2Size.x, box2Size.z) * 0.06 || 0.28;
                                                    const clearance2 = Math.max(box2Size.y * 0.02, 0.02);
                                                    const wheelY = min.y + slotApproxRadius2 + clearance2;
                                                    const lateralClearance2 = Math.max(box2Size.x * 0.02, 0.02);
                                                    const leftX2 = center.x - halfX + slotApproxRadius2 + lateralClearance2;
                                                    const rightX2 = center.x + halfX - slotApproxRadius2 - lateralClearance2;
                                                    const fallback = [
                                                        new THREE.Vector3(leftX2, wheelY, center.z - halfZ),
                                                        new THREE.Vector3(rightX2, wheelY, center.z - halfZ),
                                                        new THREE.Vector3(leftX2, wheelY, center.z + halfZ),
                                                        new THREE.Vector3(rightX2, wheelY, center.z + halfZ)
                                                    ];
                                                    for (let f of fallback) {
                                                        if (slots.length >= 4) break;
                                                        let same = false;
                                                        for (let s of slots) { if (s.distanceTo(f) < dedupTol) { same = true; break; } }
                                                        if (!same) slots.push(f);
                                                    }
                                                }
                                            } else {
                                                const box2 = new THREE.Box3().setFromObject(car);
                                                const center = box2.getCenter(new THREE.Vector3());
                                                const min = box2.min, max = box2.max;
                                                const halfX = (max.x - min.x) / 2 * 0.9;
                                                const halfZ = (max.z - min.z) / 2 * 0.9;
                                                const box2Size = box2.getSize(new THREE.Vector3());
                                                const slotApproxRadius2 = Math.max(box2Size.x, box2Size.z) * 0.06 || 0.28;
                                                const clearance2 = Math.max(box2Size.y * 0.02, 0.02);
                                                const wheelY = min.y + slotApproxRadius2 + clearance2;
                                                const inset2 = slotApproxRadius2 * 0.9;
                                                const leftX2 = center.x - halfX + inset2;
                                                const rightX2 = center.x + halfX - inset2;
                                                slots.push(new THREE.Vector3(leftX2, wheelY, center.z - halfZ)); // front-left
                                                slots.push(new THREE.Vector3(rightX2, wheelY, center.z - halfZ)); // front-right
                                                slots.push(new THREE.Vector3(leftX2, wheelY, center.z + halfZ)); // rear-left
                                                slots.push(new THREE.Vector3(rightX2, wheelY, center.z + halfZ)); // rear-right
                                            }

                                            // optional: add small debug markers attached to the car so they move with it
                                            try {
                                                window.__wheelMarkers = window.__wheelMarkers || [];
                                                // remove previous markers
                                                for (let m of window.__wheelMarkers) if (m.parent) m.parent.remove(m);
                                                window.__wheelMarkers.length = 0;
                                                const markerSize = Math.max(Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).z) * 0.02, 0.04);
                                                slots.forEach((worldPos, idx) => {
                                                    const localPos = car.worldToLocal(worldPos.clone());
                                                    const col = idx === 0 ? 0xff4444 : idx === 1 ? 0x4444ff : idx === 2 ? 0x44ff44 : 0xffee44;
                                                    const mat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.2, roughness: 0.6 });
                                                    const sph = new THREE.Mesh(new THREE.SphereGeometry(markerSize, 8, 8), mat);
                                                    sph.position.copy(localPos);
                                                    car.add(sph);
                                                    window.__wheelMarkers.push(sph);
                                                });
                                            } catch (e) {}

                                            // compute car center in local coords to identify front vs rear
                                            const carCenterWorld = new THREE.Vector3();
                                            box.getCenter(carCenterWorld);
                                            const carCenterLocal = car.worldToLocal(carCenterWorld.clone());

                                            // mount wheel clones
                                            wheelObjs = [];
                                            slots.forEach((worldPos, idx) => {
                                                const localPos = car.worldToLocal(worldPos.clone());
                                                const steer = new THREE.Object3D();
                                                steer.position.copy(localPos);
                                                car.add(steer);
                                                const spin = new THREE.Object3D();
                                                spin.position.set(0, 0, 0);
                                                steer.add(spin);

                                                // clone wheel template and deep-clone meshes' geometry/materials
                                                const wheelClone = wheelTemplate.clone(true);
                                                wheelClone.traverse(n => {
                                                    if (n.isMesh) {
                                                        if (n.geometry) n.geometry = n.geometry.clone();
                                                        if (n.material) {
                                                            if (Array.isArray(n.material)) n.material = n.material.map(m => m.clone());
                                                            else n.material = n.material.clone();
                                                        }
                                                    }
                                                });

                                                // determine wheel bbox and axis (assume smallest axis = thickness/axle)
                                                let wb = new THREE.Box3().setFromObject(wheelClone);
                                                let wbSize = new THREE.Vector3();
                                                wb.getSize(wbSize);
                                                const axis = (wbSize.x <= wbSize.y && wbSize.x <= wbSize.z) ? 'x' : (wbSize.y <= wbSize.x && wbSize.y <= wbSize.z) ? 'y' : 'z';

                                                // rotate clone so its axle aligns with local X (our spin rotates around X)
                                                if (axis === 'y') {
                                                    wheelClone.rotateZ(-Math.PI / 2);
                                                } else if (axis === 'z') {
                                                    wheelClone.rotateY(Math.PI / 2);
                                                }

                                                // scale wheel to a reasonable size relative to the car
                                                const carSize = box.getSize(new THREE.Vector3());
                                                // prefer a smaller fraction of car width/height so wheels fit under the arches
                                                const desiredRadius = Math.max(carSize.x * 0.025, carSize.y * 0.025, carSize.z * 0.025, 0.025);
                                                // recompute bbox after rotation
                                                wb = new THREE.Box3().setFromObject(wheelClone);
                                                wb.getSize(wbSize);
                                                let modelRadius = Math.max(wbSize.x, wbSize.y, wbSize.z) / 2 || 0.5;
                                                let scaleFactor = desiredRadius / modelRadius;
                                                // clamp scale to reasonable range (avoid huge wheels) but allow slightly smaller scaling
                                                scaleFactor = Math.min(Math.max(scaleFactor, 0.03), 1.2);
                                                wheelClone.scale.multiplyScalar(scaleFactor);

                                                // if this slot is on the right side, mirror the wheel geometry so the outer face points outward
                                                const isRightSide = localPos.x > 0;
                                                if (isRightSide) {
                                                    const flipMat = new THREE.Matrix4().makeScale(-1, 1, 1);
                                                    wheelClone.traverse(n => {
                                                        if (n.isMesh && n.geometry) {
                                                            try { n.geometry.applyMatrix4(flipMat); } catch (e) {}
                                                            try { if (n.geometry.computeVertexNormals) n.geometry.computeVertexNormals(); } catch (e) {}
                                                            try {
                                                                if (n.material) {
                                                                    if (Array.isArray(n.material)) n.material.forEach(m => m.side = THREE.DoubleSide);
                                                                    else n.material.side = THREE.DoubleSide;
                                                                }
                                                            } catch (e) {}
                                                        }
                                                    });
                                                }

                                                // recompute bbox then center geometry at origin so spin pivot is at axle center
                                                wb = new THREE.Box3().setFromObject(wheelClone);
                                                const wbCenter = wb.getCenter(new THREE.Vector3()).negate();
                                                wheelClone.position.add(wbCenter);

                                                // recompute bounding and radius after centering
                                                wb = new THREE.Box3().setFromObject(wheelClone);
                                                wb.getSize(wbSize);
                                                const radius = (Math.max(wbSize.y, wbSize.z) / 2) || (Math.max(wbSize.x, wbSize.y, wbSize.z) / 2) || 0.5;

                                                // attach clone to spin pivot
                                                spin.add(wheelClone);

                                                // Try discrete rotations to make the wheel axle (local X) orthogonal
                                                // to the car forward direction. Test several axis rotations and pick the best.
                                                try {
                                                    car.updateMatrixWorld(true);
                                                    const forwardTest = new THREE.Vector3();
                                                    car.getWorldDirection(forwardTest);
                                                    forwardTest.normalize();
                                                    const initial = wheelClone.rotation.clone();
                                                    let bestRot = initial.clone();
                                                    let bestScore = Infinity;
                                                    const trials = [
                                                        { x: initial.x, y: initial.y, z: initial.z },
                                                        { x: initial.x + Math.PI / 2, y: initial.y, z: initial.z },
                                                        { x: initial.x - Math.PI / 2, y: initial.y, z: initial.z },
                                                        { x: initial.x, y: initial.y + Math.PI / 2, z: initial.z },
                                                        { x: initial.x, y: initial.y - Math.PI / 2, z: initial.z },
                                                        { x: initial.x, y: initial.y, z: initial.z + Math.PI / 2 },
                                                        { x: initial.x, y: initial.y, z: initial.z - Math.PI / 2 }
                                                    ];
                                                    for (let t of trials) {
                                                        wheelClone.rotation.set(t.x, t.y, t.z);
                                                        wheelClone.updateMatrixWorld(true);
                                                        const e = wheelClone.matrixWorld.elements;
                                                        const axle = new THREE.Vector3(e[0], e[1], e[2]).normalize();
                                                        const score = Math.abs(axle.dot(forwardTest));
                                                        if (score < bestScore) { bestScore = score; bestRot = new THREE.Euler(t.x, t.y, t.z); }
                                                    }
                                                    wheelClone.rotation.copy(bestRot);
                                                    wheelClone.updateMatrixWorld(true);
                                                } catch (e) {}

                                                // Orientation heuristic: sample two opposite rim points in local +Z/-Z
                                                // and pick the one that lies farther from the car center as the 'outer' face.
                                                try {
                                                    wheelClone.updateMatrixWorld(true);
                                                    const centerWorld = wheelClone.localToWorld(new THREE.Vector3(0, 0, 0));
                                                    const sampleA = wheelClone.localToWorld(new THREE.Vector3(0, 0, wbSize.z / 2));
                                                    const sampleB = wheelClone.localToWorld(new THREE.Vector3(0, 0, -wbSize.z / 2));
                                                    const carCenterWorldFinal = new THREE.Vector3();
                                                    car.getWorldPosition(carCenterWorldFinal);
                                                    const da = sampleA.distanceTo(carCenterWorldFinal);
                                                    const db = sampleB.distanceTo(carCenterWorldFinal);
                                                    const outerSample = da > db ? sampleA : sampleB;
                                                    const outerVec = outerSample.clone().sub(centerWorld).normalize();
                                                    const toCenter = carCenterWorldFinal.clone().sub(centerWorld).normalize();
                                                    // if the 'outer' vector points toward the car center, flip 180deg around Y
                                                    if (outerVec.dot(toCenter) > 0) {
                                                        wheelClone.rotateY(Math.PI);
                                                    }
                                                    // Align axle to car lateral axis using quaternion rotation
                                                    try {
                                                        const pA = wheelClone.localToWorld(new THREE.Vector3(1, 0, 0));
                                                        const pB = wheelClone.localToWorld(new THREE.Vector3(-1, 0, 0));
                                                        const axleWorld = pA.clone().sub(pB).normalize();
                                                        const forward = new THREE.Vector3();
                                                        car.getWorldDirection(forward); forward.normalize();
                                                        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                                                        const desired = isRightSide ? right : right.clone().negate();
                                                        const q = new THREE.Quaternion().setFromUnitVectors(axleWorld, desired);
                                                        const currentWorldQuat = new THREE.Quaternion();
                                                        wheelClone.getWorldQuaternion(currentWorldQuat);
                                                        const newWorldQuat = new THREE.Quaternion().multiplyQuaternions(q, currentWorldQuat);
                                                        const parentWorldQuat = new THREE.Quaternion();
                                                        wheelClone.parent.getWorldQuaternion(parentWorldQuat);
                                                        const localQuat = parentWorldQuat.clone().invert().multiply(newWorldQuat);
                                                        wheelClone.setRotationFromQuaternion(localQuat);
                                                        wheelClone.updateMatrixWorld(true);
                                                    } catch (err) {}
                                                    // If the wheel is on the right side, ensure mirrored geometry remains correct
                                                    if (isRightSide) {
                                                        // mirror if necessary (some GLBs are modeled mirrored)
                                                        // apply a small yaw so the outer face points outward after mirror
                                                        // (no-op here; kept for future tuning)
                                                    }
                                                } catch (e) {}

                                                // align wheel world-center to the computed slot world position (compensate for mesh offsets)
                                                try {
                                                    // compute wheel's world center
                                                    const wheelBox = new THREE.Box3().setFromObject(wheelClone);
                                                    const wheelCenterLocal = wheelBox.getCenter(new THREE.Vector3());
                                                    const wheelCenterWorld = wheelClone.localToWorld(wheelCenterLocal.clone());

                                                    // desired world center is the slot world position (slotWorld[i])
                                                    const desiredWorldCenter = worldPos.clone();

                                                    // if slot Y is zero/undefined, fall back to car min + radius
                                                    if (!desiredWorldCenter.y && box) {
                                                        const carBoxSize = box.getSize(new THREE.Vector3());
                                                        const clearanceMain = Math.max(carBoxSize.y * 0.02, 0.02);
                                                        desiredWorldCenter.y = box.min.y + radius + clearanceMain;
                                                    }

                                                    // delta to move in world space
                                                    const deltaWorld = desiredWorldCenter.clone().sub(wheelCenterWorld);

                                                    // move steer by delta in world coordinates
                                                    const steerWorld = steer.getWorldPosition(new THREE.Vector3());
                                                    const newSteerWorld = steerWorld.add(deltaWorld);
                                                    const newSteerLocal = car.worldToLocal(newSteerWorld.clone());
                                                    steer.position.copy(newSteerLocal);
                                                } catch (e) {}

                                                // (deferred) will determine front/rear after final adjustments
                                                // try to place wheel center so wheel top sits just below the car inner surface
                                                try {
                                                    const raycaster = new THREE.Raycaster();
                                                    const topY = box.max.y + 1.0;
                                                    raycaster.set(new THREE.Vector3(worldPos.x, topY, worldPos.z), new THREE.Vector3(0, -1, 0));
                                                    const intersects = raycaster.intersectObject(car, true);
                                                    if (intersects && intersects.length) {
                                                        const hit = intersects[0];
                                                        const carSizeTmp = box.getSize(new THREE.Vector3());
                                                        const clearanceTop = Math.max(carSizeTmp.y * 0.02, 0.02);
                                                        let desiredCenterY = hit.point.y - clearanceTop - radius;
                                                        const minAllowed = box.min.y + radius + Math.max(carSizeTmp.y * 0.01, 0.01);
                                                        const maxAllowed = box.max.y - radius - 0.01;
                                                        desiredCenterY = Math.min(Math.max(desiredCenterY, minAllowed), maxAllowed);
                                                        const desiredLocal = car.worldToLocal(new THREE.Vector3(worldPos.x, desiredCenterY, worldPos.z));
                                                        steer.position.copy(desiredLocal);
                                                    } else {
                                                        const carBoxSize = box.getSize(new THREE.Vector3());
                                                        const clearanceMain = Math.max(carBoxSize.y * 0.02, 0.02);
                                                        const desiredWorldCenter = worldPos.clone();
                                                        desiredWorldCenter.y = box.min.y + radius + clearanceMain;
                                                        const desiredLocal = car.worldToLocal(desiredWorldCenter.clone());
                                                        steer.position.copy(desiredLocal);
                                                    }
                                                } catch (e) {}

                                                // determine front vs rear using the car's forward vector (robust to model orientation)
                                                const carCenterWorld2 = new THREE.Vector3();
                                                car.getWorldPosition(carCenterWorld2);
                                                const forwardVec2 = new THREE.Vector3();
                                                car.getWorldDirection(forwardVec2);
                                                const toSlot2 = worldPos.clone().sub(carCenterWorld2);
                                                const isFront = forwardVec2.dot(toSlot2) > 0;

                                                wheelObjs.push({ steer, spin, mesh: wheelClone, radius, isFront });
                                            });

                                            console.log('Wheel replacement finished, mounted', wheelObjs.length, 'wheels');
                                            try { window.__wheelObjs = wheelObjs; } catch (e) {}
                                        }, (err) => { console.warn('Wheel GLB parse failed:', err); try { window.__wheelLoadStatus = 'parse-failed'; } catch(e){}; createProceduralWheels(car, box); });
                                    } catch (e) {
                                        console.warn('Wheel load failed:', e, '; creating procedural wheels instead.');
                                        try { window.__wheelLoadStatus = 'fetch-failed'; } catch(e){}
                                        createProceduralWheels(car, box);
                                    }
                                })();
                            } catch (e) {
                                console.warn('Wheel replacement failed:', e);
                            }
                        }, undefined, (err) => {
                            console.error('Error loading GLB:', err);
                        });
                    }).catch(err => console.error('Could not import GLTFLoader:', err));
                }

                function initPhysics() {
                    // Minimal placeholder: physics can be added later using Ammo
                }

                function createObjects() {
                    // Already created in initGraphics for a lightweight demo
                }

                function tick() {
                    if (!renderer) return;
                    const followOffset = new THREE.Vector3(0, 3, 10); // behind & above
                    const tempVec = new THREE.Vector3();
                    const desiredPos = new THREE.Vector3();

                    renderer.setAnimationLoop(function () {
                        // delta-time
                        const dt = clock ? clock.getDelta() : 0.016;

                        if (cube) cube.rotation.y += 0.01;

                        if (carModel) {

                            // Compute world position
                            const carPos = tempVec;
                            carModel.getWorldPosition(carPos);

                            // Determine steering target: engage steering whenever A/D pressed (even when stationary)
                            let targetSteer = 0;
                            if (moveState.left) targetSteer = MAX_STEER;
                            else if (moveState.right) targetSteer = -MAX_STEER;

                            // Smoothly move current steering angle toward target
                            const steerDelta = targetSteer - steeringAngle;
                            const maxSteerChange = STEER_SPEED * dt;
                            if (Math.abs(steerDelta) > maxSteerChange) steeringAngle += Math.sign(steerDelta) * maxSteerChange;
                            else steeringAngle = targetSteer;

                            // Yaw rate from simple bicycle model (only while moving)
                            const yawRate = moveState.forward ? (CAR_SPEED / WHEELBASE) * Math.tan(steeringAngle) : 0;

                            // Apply yaw and then compute forward direction
                            carModel.rotation.y += yawRate * dt;
                            const forward = new THREE.Vector3();
                            carModel.getWorldDirection(forward);

                            // Move forward along heading when W is held
                            let forwardDistance = 0;
                            if (moveState.forward) {
                                const moveVec = forward.clone().multiplyScalar(CAR_SPEED * dt);
                                carModel.position.add(moveVec);
                                // distance traveled this frame (used to spin wheels)
                                forwardDistance = CAR_SPEED * dt;
                                // Update car world position after moving
                                carModel.getWorldPosition(carPos);
                            }

                            // Update replacement wheels: spin & steering
                            if (wheelObjs && wheelObjs.length) {
                                for (let w of wheelObjs) {
                                    // spin wheel based on forward distance (theta = s / r)
                                    if (forwardDistance && w.radius > 0) {
                                        const spinDelta = forwardDistance / w.radius;
                                        // rotate the spin pivot for wheel roll (spin pivot is parent 'spin')
                                        w.spin.rotation.x += spinDelta;
                                    }
                                    // apply steering angle to front wheels
                                    if (w.isFront) {
                                        w.steer.rotation.y = steeringAngle;
                                    } else {
                                        w.steer.rotation.y = 0;
                                    }
                                }
                            }

                            // Side view while PageUp/PageDown held
                            if (sideView !== 0) {
                                const pos = carPos;
                                    const sideDir = new THREE.Vector3(sideView, 0, 0).applyQuaternion(carModel.quaternion);
                                    desiredPos.copy(pos).add(sideDir.multiplyScalar(6));
                                    desiredPos.y += 4.0;
                                camera.position.lerp(desiredPos, 0.18);
                                const sideLook = pos.clone(); sideLook.y += CAMERA_LOOK_Y_OFFSET;
                                camera.lookAt(sideLook);
                                if (controls) { controls.target.copy(sideLook); controls.update(); }
                            } else {
                                // Place the camera a fixed distance behind the car (closer)
                                desiredPos.copy(carPos).sub(forward.clone().multiplyScalar(7));
                                desiredPos.y += 4.5;

                                // Smoothly interpolate camera position
                                camera.position.lerp(desiredPos, 0.12);

                                // Make camera look at slightly above the car for a raised angle
                                const followLook = carPos.clone(); followLook.y += CAMERA_LOOK_Y_OFFSET;
                                camera.lookAt(followLook);

                                // Keep controls target on the car for damping (if enabled)
                                if (controls) {
                                    controls.target.copy(followLook);
                                    controls.update();
                                }
                            }
                        } else {
                            if (controls) controls.update();
                        }

                        renderer.render(scene, camera);
                    });
                }

                // Run the minimal demo
                initGraphics();
                initPhysics();
                createObjects();
                tick();

            }).catch(err => {
                console.error('Ammo init error:', err);
            });

        </script>
    </body>
</html>
